name: CLA record
description: Record a CLA signature that was given outside a pull request, such as in an issue comment.
author: lollipopkit

inputs:
  login:
    description: GitHub username of the person who signed.
    required: true
  reference:
    description: URL of the comment where they signed.
    required: true
  signatures-branch:
    description: Must match the check's.
    default: cla-signatures
  signatures-path:
    description: Must match the check's.
    default: signatures/v1/cla.json
  github-token:
    description: Token with contents write.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CLA_ACTION_PATH: ${{ github.action_path }}
        CLA_LOGIN: ${{ inputs.login }}
        CLA_REFERENCE: ${{ inputs.reference }}
        CLA_BRANCH: ${{ inputs.signatures-branch }}
        CLA_PATH: ${{ inputs.signatures-path }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const env = process.env
          const { run } = require(`${env.CLA_ACTION_PATH}/../src/record.js`)
          await run({ github, context, core }, {
            login: env.CLA_LOGIN,
            reference: env.CLA_REFERENCE,
            branch: env.CLA_BRANCH,
            path: env.CLA_PATH,
          })
